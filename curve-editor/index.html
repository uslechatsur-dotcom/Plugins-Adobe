<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Legolas+ Curve Editor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand">LEGOLAS<span class="plus">+</span><span id="count" class="dim"></span></div>
    <div id="hostname" class="dim"></div>
  </div>

  <div id="tabbar">
    <div class="tabs">
      <button class="tab active" data-tab="curves">Curves</button>
      <button class="tab" data-tab="keys">Keyframes</button>
      <button class="tab" data-tab="anim">Animations</button>
    </div>
    <div class="tools">
      <button class="tool" id="btn-scan" title="Rescan selected clip">&#8635;</button>
      <button class="tool" id="btn-save" title="Save selected easing as a custom preset">&#9733;</button>
      <button class="tool" id="btn-add" title="Add keyframe at playhead">&#9670;+</button>
      <button class="tool" id="btn-del" title="Delete selected keyframes (Del)">&#10005;</button>
      <button class="tool" id="btn-undo" title="Undo (Ctrl+Z)">&#8630;</button>
      <button class="tool" id="btn-redo" title="Redo (Ctrl+Shift+Z)">&#8631;</button>
      <button class="tool toggle on" id="btn-live" title="Live apply: write to Premiere as you edit">LIVE</button>
    </div>
  </div>

  <section id="tab-curves" class="pane">
    <div class="split">
      <div id="chlist"></div>
      <div class="stage"><canvas id="cv"></canvas></div>
    </div>
    <div id="presetbar">
      <div class="groups" id="groups"></div>
      <div class="presets" id="presets"></div>
      <div class="strength"><label for="strength">Strength</label><input id="strength" type="range" min="0" max="100" value="100"><span id="strength-v">100%</span></div>
    </div>
  </section>

  <section id="tab-keys" class="pane hidden">
    <div class="stage"><canvas id="dope"></canvas></div>
  </section>

  <section id="tab-anim" class="pane hidden">
    <div class="split">
      <div id="anim-list"></div>
      <div class="anim-main">
        <div class="anim-title" id="anim-title">Bounce</div>
        <div class="anim-preview"><canvas id="anim-cv"></canvas></div>
        <div class="anim-hint dim" id="anim-hint"></div>
      </div>
      <div class="anim-side">
        <div id="anim-params"></div>
        <label class="field">Target
          <select id="anim-target"></select>
        </label>
        <button id="anim-apply" class="primary">Apply at playhead</button>
      </div>
    </div>
  </section>

  <div id="status"></div>
</div>
<script src="js/easing.js"></script>
<script src="js/bake.js"></script>
<script src="js/animations.js"></script>
<script src="js/host.js"></script>
<script src="js/app.js"></script>
</body>
</html>
